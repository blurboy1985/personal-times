[project]
name = "personal-times"
version = "0.1.0"
description = "The Personal Times — a personal 7am newspaper: world news, inbox dispatch, portfolio desk."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "feedparser>=6.0",
    "google-auth>=2.30",
    "requests>=2.32",
    "pyotp>=2.9",
    "segno>=1.6",
    "webauthn>=3.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
