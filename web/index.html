<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140d08" />
    <meta name="robots" content="noindex, nofollow" />
    <title>The Personal Times</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="reader">
    <canvas id="desk" aria-hidden="true"></canvas>
    <div id="app">
      <div class="press" id="press" role="status">
        <span class="press__mark">The Personal Times</span>
        <span class="press__line">Pulling this morning's edition off the press…</span>
      </div>

      <main class="sheet is-hidden" id="sheet" hidden></main>

      <nav class="folio" id="folio" aria-label="Newspaper pages" hidden>
        <button class="folio__util" id="issues-btn" aria-expanded="false" aria-controls="issues" title="Back issues">
          <span aria-hidden="true">☰</span><span class="folio__util-text"> Back issues</span>
        </button>
        <span class="folio__sep" aria-hidden="true"></span>
        <button class="folio__arrow" data-dir="-1" aria-label="Previous page">‹</button>
        <button class="folio__tab" data-goto="0"><b>A1</b><span class="folio__label">The World</span></button>
        <button class="folio__tab" data-goto="1"><b>A2</b><span class="folio__label">Inbox</span></button>
        <button class="folio__tab" data-goto="2"><b>A3</b><span class="folio__label">Markets</span></button>
        <button class="folio__arrow" data-dir="1" aria-label="Next page">›</button>
        <span class="folio__sep" aria-hidden="true"></span>
        <button class="folio__util" id="keys-btn" aria-expanded="false" aria-controls="keys" title="Passkeys">
          <span aria-hidden="true">🔑</span><span class="folio__util-text"> Passkeys</span>
        </button>
        <button class="folio__util" id="logout-btn" title="Sign out">
          <span aria-hidden="true">⏻</span><span class="folio__util-text"> Sign out</span>
        </button>
      </nav>

      <aside class="issues" id="issues" aria-label="Back issues" hidden>
        <h2>Back Issues</h2>
        <ol id="issues-list"></ol>
      </aside>

      <aside class="keys" id="keys" aria-label="Passkeys" hidden>
        <h2>Passkeys</h2>
        <p class="keys__lede">Sign in with Face ID, Touch ID or your device PIN. Your password and code still work as a backup.</p>
        <ul class="keys__list" id="keys-list"></ul>
        <p class="keys__status" id="keys-status" role="status"></p>
        <button class="keys__add" id="keys-add" type="button">Add a passkey on this device</button>
      </aside>
    </div>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
